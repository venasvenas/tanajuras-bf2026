name: Deploy BF2026 CRM Worker

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker

      - name: Show Worker URL
        run: |
          echo "Worker deployed as 'bf2026-crm'."
          echo "URL: https://bf2026-crm.<workers-subdomain>.workers.dev"
          echo "Check Cloudflare Dashboard > Workers > bf2026-crm to confirm the live URL."
          echo "Then update index.html: set window.CLOUDFLARE_WORKER_URL = '<url>'"
