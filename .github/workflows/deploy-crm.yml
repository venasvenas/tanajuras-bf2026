name: Deploy BF2026 CRM Worker

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --dry-run=false

      - name: Set ADMIN_TOKEN Cloudflare Secret
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_TOKEN: ${{ secrets.CRM_ADMIN_TOKEN }}
        run: |
          RESULT=$(curl -s -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/bf2026-crm/secrets" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"ADMIN_TOKEN\",\"text\":\"$ADMIN_TOKEN\",\"type\":\"secret_text\"}")
          echo "Secret set result: $(echo $RESULT | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get(\"success\"))')"

      - name: Extract Worker URL and Update LP
        id: update-lp
        env:
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "Worker URL: $WORKER_URL"
          if [ -z "$WORKER_URL" ]; then
            echo "ERROR: No deployment URL available"
            exit 1
          fi

          python3 - << 'PYEOF'
import os
worker_url = os.environ['WORKER_URL']
with open('index.html', 'r') as f:
    content = f.read()
old = "const CLOUDFLARE_WORKER_URL = window.CLOUDFLARE_WORKER_URL || null;"
new = f"const CLOUDFLARE_WORKER_URL = window.CLOUDFLARE_WORKER_URL || '{worker_url}';"
updated = content.replace(old, new, 1)
if updated == content:
    print("WARNING: placeholder not found, LP not updated")
else:
    with open('index.html', 'w') as f:
        f.write(updated)
    print(f"LP updated with worker URL: {worker_url}")
PYEOF

      - name: Commit LP Update
        env:
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          git config user.email "paperclip-bot@tanajuras.com.br"
          git config user.name "Paperclip CRM Bot"
          git add index.html
          if git diff --staged --quiet; then
            echo "No LP changes to commit"
          else
            git commit -m "feat(crm): activate bf2026-crm worker in LP

Deployed and activated automatically via GitHub Actions.
Worker URL: $WORKER_URL

Co-Authored-By: Paperclip <noreply@paperclip.ing>"
            git push
            echo "LP updated and pushed!"
          fi
